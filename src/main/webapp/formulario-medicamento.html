<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar medicamento - MediApp</title>
</head>

<body>

    <h1>Registrar medicamento</h1>

    <form action="medicamentos" method="post">

        <label for="nombre">Nombre del medicamento:</label>
        <br>
        <input type="text" id="nombre" name="nombre" required>
        <br><br>

        <label for="descripcion">Descripción:</label>
        <br>
        <textarea id="descripcion" name="descripcion"></textarea>
        <br><br>

        <label for="precio">Precio:</label>
        <br>
        <input type="number" id="precio" name="precio" step="0.01" min="0.01" required>
        <br><br>

        <label for="stock">Stock:</label>
        <br>
        <input type="number" id="stock" name="stock" min="0" required>
        <br><br>

        <label for="categoria">ID de categoría:</label>
        <br>
        <input type="number" id="categoria" name="categoria" value="1" required>
        <br><br>

        <button type="submit">Registrar medicamento</button>

    </form>

</body>
</html>
